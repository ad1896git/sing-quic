# Formatting remains available through make fmt; existing formatting debt is
# intentionally outside the required correctness gate.
linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - paralleltest
    - ineffassign

linters-settings:
  gci:
    custom-order: true
    sections:
      - standard
      - prefix(github.com/sagernet/)
      - default
  # Serial integration tests are intentional; still check misuse of t.Parallel.
  paralleltest:
    ignore-missing: true
    ignore-missing-subtests: true
  staticcheck:
    checks:
      - all
      - -SA1003

run:
  go: "1.20" # Match go.mod; CI selects the compiler separately.
  timeout: 5m
  modules-download-mode: readonly
